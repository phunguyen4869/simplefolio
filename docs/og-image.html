<!doctype html>
<!--
  Source of src/assets/og-image.jpg, the 1200×630 image shown when the site
  is shared. Edit this file, open it in a browser window sized 1200×630,
  take a screenshot of the page and save it over src/assets/og-image.jpg.
  Fonts come from node_modules, so run `npm install` first.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phú Nguyễn — share image</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2")
          format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+2215;
      }
      @font-face {
        font-family: "Inter Variable";
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/inter/files/inter-vietnamese-wght-normal.woff2")
          format("woff2-variations");
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1,
          U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329,
          U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Space Grotesk Variable";
        font-weight: 300 700;
        src: url("../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      :root {
        --teal: #00cdac;
        --purple: #7c5cff;
        --gradient: linear-gradient(135deg, var(--teal), var(--purple));
        --text: #eef0f6;
        --muted: #9aa0b4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 64px;
        padding: 0 68px 0 80px;
        font-family: "Inter Variable", system-ui, sans-serif;
        color: var(--text);
        background: #0a0b10;
      }

      /* Blurred color blobs, then a dotted grid over them */
      .blob {
        position: absolute;
        z-index: -2;
        border-radius: 50%;
        filter: blur(90px);
      }
      .blob--purple {
        width: 520px;
        height: 520px;
        top: -220px;
        right: -80px;
        background: var(--purple);
        opacity: 0.55;
      }
      .blob--teal {
        width: 420px;
        height: 420px;
        bottom: -200px;
        left: -100px;
        background: var(--teal);
        opacity: 0.45;
      }
      .blob--pink {
        width: 300px;
        height: 300px;
        top: 230px;
        left: 500px;
        background: #ff6b9d;
        opacity: 0.25;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px
        );
        background-size: 32px 32px;
      }

      .gradient-text {
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .logo {
        font-family: "Space Grotesk Variable", sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* inline-flex: the pill grows with its text instead of clipping it */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 56px;
        padding: 11px 22px 11px 20px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        font-size: 19px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
      }
      .badge::before {
        content: "";
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--teal);
      }

      h1 {
        margin-top: 22px;
        padding-bottom: 6px;
        font-size: 80px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .role {
        margin-top: 8px;
        font-size: 36px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .stack {
        margin-top: 44px;
        font-size: 23px;
        color: var(--muted);
      }

      .photo {
        flex-shrink: 0;
        width: 360px;
        height: 360px;
        padding: 3px;
        border-radius: 44px;
        background: var(--gradient);
      }
      .photo div {
        width: 100%;
        height: 100%;
        padding: 11px;
        border-radius: 41px;
        background: #12141c;
      }
      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 30px;
      }
    </style>
  </head>
  <body>
    <span class="blob blob--purple"></span>
    <span class="blob blob--teal"></span>
    <span class="blob blob--pink"></span>

    <main>
      <p class="logo">PN<span class="gradient-text">.</span></p>
      <p class="badge">Available for new opportunities</p>
      <h1><span class="gradient-text">Phú Nguyễn</span></h1>
      <p class="role">Senior Full Stack Developer</p>
      <p class="stack">PHP · Laravel · VueJS · Golang · PostgreSQL · AWS</p>
    </main>

    <div class="photo">
      <div><img src="../src/assets/profile.webp" alt="" /></div>
    </div>
  </body>
</html>
